function leadModal(id,focus=false){let l=leads.find(x=>x.id===id),bg=document.createElement('div'),close=()=>{document.removeEventListener('keydown',onKey);bg.remove()},onKey=e=>{if(e.key==='Escape')close()};bg.className='modal-bg';bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="lead-title"><header><h3 id="lead-title">${l.name}</h3><button class="control" data-close aria-label="Fechar">×</button></header><div class="modal-body"><p>14/08/2026 · WhatsApp fictício: (11) 90000-100${l.id}</p><div class="form"><label class="wide">Etapa<select id="lead-stage">${stages.map(s=>`<option ${s===l.stage?'selected':''}>${s}</option>`).join('')}</select></label><label class="wide">Observação<textarea id="lead-note">${l.note}</textarea></label><label>Nova tarefa<input id="task-name" placeholder="Retornar ligação"></label></div><ul>${l.tasks.map(t=>`<li>${t}</li>`).join('')}</ul></div><footer><button class="control" data-close>Cancelar</button><button class="control" id="add-task">Adicionar tarefa</button><button class="primary" id="save">Salvar</button></footer></div>`;document.body.append(bg);document.addEventListener('keydown',onKey);bg.onclick=e=>{if(e.target===bg)close()};qa('[data-close]').forEach(b=>b.onclick=close);q('#add-task').onclick=()=>{let t=q('#task-name').value.trim();if(t){l.tasks.push(t);close();leadModal(id,true)}};q('#save').onclick=()=>{l.stage=q('#lead-stage').value;l.note=q('#lead-note').value;close();drawBoard()};(focus?q('#task-name'):q('[data-close]')).focus()}

function renderClipagem(){let items=[['Tribunal publica novo entendimento','Decisão'],['Órgão altera prazo de procedimento','Regulação'],['Pesquisa revela comportamento do setor','Mercado']];demo.innerHTML=`<div class="generic"><h3>Radar de clipagem</h3><p>Selecione uma atualização para transformá-la em insumo editorial.</p><div class="clip-grid">${items.map((x,i)=>`<button class="visual-card" data-clip="${i}"><small>${x[1]}</small><h4>${x[0]}</h4><p>Fonte pública · hoje</p></button>`).join('')}</div><div class="result" id="clip-result">Selecione uma atualização.</div></div>`;qa('[data-clip]').forEach(b=>b.onclick=()=>{let x=items[Number(b.dataset.clip)];q('#clip-result').innerHTML=`<b>Pauta sugerida:</b> O que “${x[0]}” muda na prática?<br><br><b>Estrutura:</b> contexto → impacto → orientação → chamada para conversa.`})}
function renderTracker(){let nodes=['Anúncio','Landing page','Clique WhatsApp','Conversa confirmada','CRM','Conversão'];demo.innerHTML=`<div class="generic"><h3>Rastreamento de origem</h3><p>Veja um clique fictício percorrer o fluxo até a conversão.</p><div class="tracker-line">${nodes.map((n,i)=>`<div class="tracker-node" data-track="${i}">${n}</div>${i<nodes.length-1?'→':''}`).join('')}</div><button class="action" id="track">Simular clique</button><div class="result" id="track-result">Nenhum evento iniciado.</div></div>`;q('#track').onclick=async()=>{qa('[data-track]').forEach(n=>n.classList.remove('active'));for(let n of qa('[data-track]')){n.classList.add('active');q('#track-result').textContent=n.textContent+' registrado.';await new Promise(r=>setTimeout(r,350))}q('#track-result').textContent='Origem associada à conversa e preparada para atribuição.'}}
function renderBiblioteca(){let cards=[['Abertura editorial','Landing pages'],['Prova em números','Conversão'],['Serviços em sequência','Institucional'],['Linha do tempo','Conteúdo'],['Chamada lateral','Conversão'],['Comparativo','Apresentação']];demo.innerHTML=`<div class="generic"><h3>Biblioteca visual</h3><p>Estruturas catalogadas para orientar páginas sem reduzir todo projeto ao mesmo template.</p><div class="gallery">${cards.map((x,i)=>`<button class="visual-card" data-pattern="${i}"><div class="thumb"></div><b>${x[0]}</b><p>${x[1]}</p></button>`).join('')}</div><div class="result" id="pattern-result">Abra um padrão para ver sua aplicação.</div></div>`;qa('[data-pattern]').forEach(b=>b.onclick=()=>{let x=cards[Number(b.dataset.pattern)];q('#pattern-result').innerHTML=`<b>${x[0]}</b><br>Uso recomendado: ${x[1]}. Estrutura pronta para ser descrita em briefing e reaplicada com consistência.`})}
function renderProcessual(){demo.innerHTML=`<div class="generic"><h3>Histórico do processo</h3><p>Movimentações fictícias organizadas em uma linha do tempo legível.</p><select class="control" id="process-select"><option>Processo demonstrativo 001</option><option>Processo demonstrativo 002</option></select><div class="timeline" id="timeline"><div><b>Distribuição registrada</b><p>12/08 · processo recebido pelo órgão.</p></div><div><b>Documento juntado</b><p>15/08 · nova peça adicionada.</p></div><div><b>Prazo identificado</b><p>18/08 · acompanhamento necessário.</p></div></div><button class="action" id="check-process">Verificar atualização</button></div>`;q('#check-process').onclick=e=>{q('#timeline').insertAdjacentHTML('beforeend','<div><b>Nova movimentação encontrada</b><p>Hoje · item adicionado à demonstração.</p></div>');e.currentTarget.disabled=true};q('#process-select').onchange=renderProcessual}
function renderFinanceiro(){demo.innerHTML=`<div class="generic"><h3>Visão financeira</h3><p>Altere o período para recalcular a demonstração.</p><select class="control" id="finance-period"><option value="1">Este mês</option><option value=".72">Mês anterior</option><option value="2.8">Trimestre</option></select><div class="finance-grid" id="finance-metrics"></div><div class="visual-card"><b>Fluxo de caixa</b><div class="bars">${[35,62,48,80,67,92,76].map(x=>`<i style="height:${x}%"></i>`).join('')}</div></div><div class="table" style="margin-top:14px"><table><tbody><tr><td>Receita de serviços</td><td>Entrada</td><td>R$ 18.400</td></tr><tr><td>Ferramentas e mídia</td><td>Saída</td><td>R$ 4.280</td></tr><tr><td>Operação</td><td>Saída</td><td>R$ 6.150</td></tr></tbody></table></div></div>`;function calc(){let f=Number(q('#finance-period').value);q('#finance-metrics').innerHTML=metric('Receitas',money(18400*f),'good')+metric('Despesas',money(10430*f),'warn')+metric('Resultado',money(7970*f),'good')}q('#finance-period').onchange=calc;calc()}
window.addEventListener('hashchange',()=>{state.project=location.hash.slice(1)||'ads';render()});render();
</script>
</body></html>
